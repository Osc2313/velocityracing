<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velocity Racing — Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="external.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-logo">
        <span class="logo-twilight">Velocity</span>
        <span class="logo-simracing">Racing</span>
      </div>
      <div class="topbar-center" id="compInfo">
        <span class="comp-name">—</span>
        <span class="comp-track"></span>
      </div>
      <div class="topbar-right">
        <div class="live-badge"><span class="live-dot"></span>LIVE</div>
        <div class="clock" id="clock">00:00:00</div>
      </div>
    </header>

    <div class="message-banner" id="messageBanner" style="display:none">
      <span class="message-icon">📢</span>
      <span class="message-text" id="messageText"></span>
    </div>

    <main class="main-content" id="mainContent"></main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="external.js"></script>
</body>
</html>
